name: Радар заказов

# Бот сам просыпается по расписанию: забирает свежие заказы с бирж,
# отфильтровывает подходящие и присылает их в Telegram. Сервер не нужен.
on:
  schedule:
    # Страховка на случай, если внешний планировщик (см. README) остановится.
    # Основной ритм задаёт repository_dispatch — он не пропускает слоты и не тратит
    # лишние минуты, поэтому здесь достаточно редкого резервного расписания.
    - cron: "0 */6 * * *"    # раз в 6 часов
  repository_dispatch:        # внешний планировщик может дёргать запуск точно по времени
    types: [radar]
  workflow_dispatch:          # и кнопка «Run workflow» для ручного запуска
    inputs:
      mode:
        description: "once — опросить и разослать; dryrun — только проверить ленты бирж"
        type: choice
        default: once
        options: [once, dryrun, probe, sample]
      urls:
        description: "для режима probe: адреса лент через пробел"
        type: string
        default: ""

concurrency:
  group: freelance-radar
  cancel-in-progress: false

permissions:
  contents: write             # нужно, чтобы сохранять состояние в ветку radar-state

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      # Состояние (что уже отправлено) держим в кэше Actions, а не в ветке:
      # в базе лежат id чатов, а репозиторий может быть публичным.
      - name: Восстановить состояние прошлого запуска
        uses: actions/cache/restore@v4
        with:
          path: data/freelance.db
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Забрать состояние из старой ветки, если кэша ещё нет
        run: |
          mkdir -p data
          if [ -f data/freelance.db ]; then
            echo "Состояние из кэша: $(du -h data/freelance.db | cut -f1)"
          elif git fetch --depth=1 origin radar-state 2>/dev/null; then
            git show FETCH_HEAD:freelance.db > data/freelance.db
            echo "Состояние перенесено из ветки radar-state"
          else
            echo "Первый запуск: состояния ещё нет"
          fi

      # По расписанию inputs.mode пуст, поэтому проверяем и событие.
      - name: Опросить биржи и разослать заказы
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'once'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHAT_IDS: ${{ secrets.TARGET_CHAT_IDS }}
          DB_PATH: data/freelance.db
          MIN_SCORE: "5"
          MAX_PER_CYCLE: "10"
          MIN_SOURCE_INTERVAL: "600"   # одну биржу дёргаем не чаще раза в 10 минут
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::warning::Секрет BOT_TOKEN не задан — рассылка пропущена."
            echo "Добавьте его: Settings → Secrets and variables → Actions → New repository secret"
            exit 0
          fi
          python -m freelance_bot once

      # Проверка лент без токена: видно, какие биржи отвечают из сети GitHub.
      - name: Проверить ленты бирж
        if: inputs.mode == 'dryrun'
        env:
          DB_PATH: data/freelance.db
        run: python -m freelance_bot dryrun

      - name: Проверить ленты-кандидаты
        if: inputs.mode == 'probe'
        env:
          URLS: ${{ inputs.urls }}
        run: python -m freelance_bot probe $URLS

      - name: Показать сырые поля ленты
        if: inputs.mode == 'sample'
        env:
          URLS: ${{ inputs.urls }}
        run: python -m freelance_bot sample ${URLS:-https://www.fl.ru/rss/all.xml}

      - name: Сохранить состояние
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'once')
        uses: actions/cache/save@v4
        with:
          path: data/freelance.db
          key: radar-state-${{ github.run_id }}
