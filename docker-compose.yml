services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/freelance.db
    volumes:
      - ./data:/app/data

  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile.trading
    restart: unless-stopped
    env_file: .env.trading
    environment:
      DB_PATH: /app/data-trading/trading.db
    ports:
      - "8080:8080"
    volumes:
      - ./data-trading:/app/data-trading
